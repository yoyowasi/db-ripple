name: CI

# PR·main push마다: dotnet(DB 없음), web, scripts-ps51, db(실제 SQL Server 2025 CU10 컨테이너, DB 테스트 전체),
# pg(PostgreSQL 16·17·18 서비스 컨테이너, 비 superuser 계정으로 PostgreSQL 최소판 통합 테스트).
# 평가(Eval)·N1은 오래 걸려 main push와 수동 실행(workflow_dispatch)에서만 db 잡이 함께 돌린다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      eval_repeat:
        # 2026-11-19: B1 포함 20회 같은 정식 평가를 CI에서 돌리려고 둔다(기준선 logs/eval/eval-20261112-143835도 20회). PR·push는 늘 3회.
        description: "db 잡 home-test 기본 실행의 평가 반복 횟수(-EvalRepeat, 1~50)"
        required: false
        default: "3"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  dotnet:
    name: .NET 빌드·테스트 (DB 없음)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'nuget.config', '**/packages.lock.json', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: 복원
        run: dotnet restore DbRipple.slnx
      - name: SP19 스크립트 회귀 (Linux PowerShell 7, DB 불필요)
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts/tests/sp19.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & pwsh -NoProfile -File scripts/tests/sp19-precheck.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 빌드 (경고를 오류로)
        run: dotnet build DbRipple.slnx --no-restore -warnaserror
      - name: 테스트 (DB 연결 변수 없음, DB 테스트는 건너뜀)
        run: dotnet test DbRipple.slnx --no-build --logger trx --results-directory "$RUNNER_TEMP/trx"
      - name: TRX 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-trx
          path: ${{ runner.temp }}/trx
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: web 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: 타입 검사와 빌드 (AG Grid chunk 크기 경고는 실패가 아님)
        run: npm run build

  scripts-ps51:
    name: PowerShell 5.1 스크립트 회귀
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: home-test.Tests.ps1 (Windows PowerShell 5.1, DB 불필요)
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/home-test.Tests.ps1 -OutputDirectory "$env:RUNNER_TEMP\home-test-tests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: SP19 스크립트 회귀 (Windows PowerShell 5.1, DB 불필요)
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/sp19.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripts-ps51-results
          path: ${{ runner.temp }}/home-test-tests
          if-no-files-found: ignore
          retention-days: 14

  db:
    name: DB 테스트 (SQL Server 2025 CU10 컨테이너)
    runs-on: ubuntu-latest
    # 수동 실행은 평가 반복을 늘릴 수 있어 시간을 넉넉히 둔다.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 150 || 60 }}
    # PR·main 모두 기본 실행(Build·Tests·Eval·N1)과 EXEC 포함 실행(Eval·N1)을 돈다(2026-11-16 측정: 둘 합쳐 약 10분).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'nuget.config', '**/packages.lock.json', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: .env 만들기 (SA 비밀번호는 실행마다 무작위, 로그에서 가림, 저장소 secret 안 씀)
        shell: bash
        run: |
          set -euo pipefail
          PW="Aa1-$(openssl rand -hex 16)"
          echo "::add-mask::$PW"
          umask 077
          printf 'MSSQL_SA_PASSWORD=%s\n' "$PW" > .env
      - name: AdventureWorks 받기 (Microsoft 공식 샘플)
        shell: pwsh
        run: ./scripts/fetch-adventureworks.ps1
      - name: SQL Server 컨테이너 기동
        shell: pwsh
        run: ./scripts/db-up.ps1 -TimeoutSec 240
      - name: AW_Origin 복원
        shell: pwsh
        run: |
          . ./scripts/env.ps1
          ./scripts/restore-aw-origin.ps1
      - name: home-test 기본 (Build·Tests·Eval·N1), 전체 PASS여야 통과
        shell: pwsh
        env:
          DBRIPPLE_RUN_SP7: "1"
          # 입력값은 스크립트에 직접 넣지 않고 환경 변수로 받아 숫자로 검사한다.
          EVAL_REPEAT: ${{ inputs.eval_repeat || '3' }}
        run: |
          $repeat = 0
          if (-not [int]::TryParse($env:EVAL_REPEAT, [ref]$repeat) -or $repeat -lt 1 -or $repeat -gt 50) { "eval_repeat는 1~50 정수여야 함: '$env:EVAL_REPEAT'"; exit 1 }
          "평가 반복: $repeat회"
          ./scripts/home-test.ps1 -Date ci -EvalRepeat $repeat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # home-test는 WARN에도 0으로 끝난다. 기본 30사례 평가의 지표가 기준선과 달라지면 WARN이므로 여기서 막는다.
          $s = Get-Content -LiteralPath logs/home-test/ci/summary.json -Raw | ConvertFrom-Json
          "기본 실행 전체: $($s.overall)"
          if ($s.overall -ne 'PASS') { $s.steps | Format-Table -AutoSize | Out-String -Width 400; exit 1 }
      - name: home-test EXEC 포함 (Eval·N1), 사례 집합이 달라 WARN 허용
        shell: pwsh
        run: ./scripts/home-test.ps1 -IncludeExec -Skip Build,Tests -Date ci-exec
      # ApplySqlTests는 -p:ApplyIntegration=true에서만 컴파일되어 위 전체 테스트에 들어가지 않는다.
      - name: Apply DB 테스트 (ApplyIntegration)
        shell: pwsh
        run: |
          . ./scripts/env.ps1
          $trx = 'logs/home-test/ci/apply-integration/trx'
          dotnet test tests/DbRipple.Apply.Tests -p:ApplyIntegration=true --logger 'trx;LogFileName=apply-integration.trx' --results-directory $trx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # DB 변수가 빠지면 SqlFact가 조용히 건너뛰므로, 건너뜀이 있으면 실패로 본다(의도적 Skip 없음).
          [xml]$x = Get-Content -LiteralPath (Join-Path $trx 'apply-integration.trx') -Raw
          $c = $x.TestRun.ResultSummary.Counters
          "Apply DB 테스트: 전체 $($c.total), 통과 $($c.passed), 실패 $($c.failed), 미실행 $($c.notExecuted)"
          if ([int]$c.notExecuted -ne 0 -or [int]$c.total -ne [int]$c.passed) { exit 1 }
      - name: 진단 로그 정리 (비밀번호가 들어간 파일은 올리지 않는다)
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p logs/home-test
          if [ -f .env ]; then
            PW="$(sed -n 's/^MSSQL_SA_PASSWORD=//p' .env)"
            if [ -n "$PW" ]; then
              # grep은 일치가 없으면 1을 내고 pipefail이 단계를 실패시키므로 || true.
              { grep -rlF -- "$PW" logs/home-test 2>/dev/null || true; } | while read -r f; do
                echo "비밀번호가 포함된 파일은 올리지 않고 삭제: $f"
                rm -f -- "$f"
              done
            fi
          fi
          docker compose logs --tail 200 sql > logs/home-test/sql-container.log 2>/dev/null || true
      - name: 진단 로그 올리기 (요약·TRX·실패 목록·평가·N1)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-home-test-logs
          path: |
            logs/home-test/ci*/**/summary.*
            logs/home-test/ci*/**/failed-tests.txt
            logs/home-test/ci*/**/dotnet-*.log
            logs/home-test/ci*/**/eval-*.csv
            logs/home-test/ci*/**/trx/**
            logs/home-test/ci*/**/eval/**
            logs/home-test/ci*/**/n1/**
            logs/home-test/sql-container.log
          if-no-files-found: ignore
          retention-days: 14
      - name: 컨테이너 정리
        if: always()
        shell: bash
        run: docker compose down -v || true

  pg:
    name: PostgreSQL ${{ matrix.pg }} 통합 테스트 (비 superuser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # tests/DbRipple.Postgres.Tests 전체(순수 + PgFact 통합). 연결 계정은 LOGIN NOSUPERUSER CREATEDB CREATEROLE(설계 결정 3 권장 구성).
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          # 컨테이너 기동에만 쓰는 임시 값. 첫 단계(checkout 전)에서 실행마다 무작위 값으로 바꾸고 로그에서 가린다(저장소 secret 안 씀).
          POSTGRES_PASSWORD: bootstrap-only-rotated-in-first-step
        ports:
          - 5432/tcp
        # 초기화 중 임시 서버는 TCP를 열지 않으므로 127.0.0.1로 물어 최종 서버가 뜬 뒤에만 healthy가 된다.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
      # checkout·.NET 준비보다 먼저 바꿔 기동용 임시 비밀번호가 유효한 시간을 줄인다(docker·openssl·psql만 쓰고 저장소 파일은 필요 없음).
      - name: superuser 비밀번호 바꾸기·비 superuser 계정 만들기 (실행마다 무작위, 로그에서 가림)
        shell: bash
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          set -euo pipefail
          SU_PW="$(openssl rand -hex 24)"
          IT_PW="$(openssl rand -hex 24)"
          echo "::add-mask::$SU_PW"
          echo "::add-mask::$IT_PW"
          umask 077
          printf 'SU_PW=%s\nIT_PW=%s\n' "$SU_PW" "$IT_PW" > "$RUNNER_TEMP/pg-secrets.env"
          # 공식 이미지는 컨테이너 안 소켓 연결을 trust로 받는다. SQL은 표준 입력으로 넘겨 명령 줄에 비밀번호를 남기지 않는다.
          printf "ALTER ROLE postgres PASSWORD '%s';\n" "$SU_PW" | docker exec -i "$PG_CONTAINER" psql -X -q -v ON_ERROR_STOP=1 -U postgres -d postgres
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          export PGHOST=127.0.0.1 PGPORT="$PG_PORT" PGUSER=postgres PGDATABASE=postgres PGPASSWORD="$SU_PW" PGCONNECT_TIMEOUT=10
          # 러너의 psql로 TCP(무작위 superuser 비밀번호)에 붙어 테스트 계정을 만든다. 비밀번호는 16진수라 따옴표 안에 그대로 둘 수 있다.
          {
            echo "SELECT version();"
            printf "CREATE ROLE dbr_it LOGIN NOSUPERUSER CREATEDB CREATEROLE PASSWORD '%s';\n" "$IT_PW"
            echo "SELECT rolname, rolsuper, rolcreatedb, rolcreaterole FROM pg_roles WHERE rolname = 'dbr_it';"
          } | psql -X -v ON_ERROR_STOP=1
          echo "DBRIPPLE_PG_TEST_CONNECTION=Host=127.0.0.1;Port=$PG_PORT;Database=postgres;Username=dbr_it;Password=$IT_PW;Timeout=30" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'nuget.config', '**/packages.lock.json', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: 빌드 (경고를 오류로)
        run: dotnet build tests/DbRipple.Postgres.Tests -warnaserror
      - name: PostgreSQL 통합 테스트 (전체 통과·건너뜀 0·통합 6건 이상 통과여야 통과)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'pg-trx'
          dotnet test tests/DbRipple.Postgres.Tests --no-build --logger 'trx;LogFileName=pg.trx' --logger 'console;verbosity=detailed' --results-directory $out
          $code = $LASTEXITCODE
          $trx = Join-Path $out 'pg.trx'
          if (-not (Test-Path -LiteralPath $trx)) { "TRX 없음(종료 코드 $code)"; exit 1 }
          [xml]$x = Get-Content -LiteralPath $trx -Raw
          $c = $x.TestRun.ResultSummary.Counters
          # xunit Skip은 notExecuted에 잡히지 않을 수 있어 건너뜀은 전체 − 통과 − 실패로 센다.
          $skipped = [int]$c.total - [int]$c.passed - [int]$c.failed
          $integration = @(@($x.TestRun.Results.UnitTestResult) | Where-Object { $_.testName -like '*PgIntegrationTests*' })
          $integrationPassed = @($integration | Where-Object { $_.outcome -eq 'Passed' }).Count
          "PostgreSQL ${{ matrix.pg }} 테스트: 전체 $($c.total), 통과 $($c.passed), 실패 $($c.failed), 건너뜀 $skipped, 미실행 $($c.notExecuted), PgIntegrationTests 통과 $integrationPassed/$($integration.Count)"
          foreach ($r in $integration) { "  $($r.outcome) $($r.testName)" }
          if ($code -ne 0) { exit $code }
          # 연결 변수가 빠지면 PgFact가 조용히 건너뛰므로 건너뜀이 하나라도 있으면 실패다(의도적 Skip 없음).
          if ([int]$c.total -le 0 -or $skipped -ne 0 -or [int]$c.notExecuted -ne 0 -or [int]$c.total -ne [int]$c.passed) { exit 1 }
          # 통합 테스트가 이름으로 실제 통과했는지(PgFact 6건).
          if ($integrationPassed -lt 6) { "PgIntegrationTests 통과 $integrationPassed건(기대 6건 이상)"; exit 1 }
      - name: 테스트 DB·역할 정리 확인 (접두 dbr_it_가 0개여야 통과)
        if: always()
        shell: bash
        env:
          PG_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/pg-secrets.env" ]; then echo "비밀번호 파일 없음(첫 단계 실패): 확인하지 않음"; exit 0; fi
          . "$RUNNER_TEMP/pg-secrets.env"
          export PGHOST=127.0.0.1 PGPORT="$PG_PORT" PGUSER=postgres PGDATABASE=postgres PGPASSWORD="$SU_PW" PGCONNECT_TIMEOUT=10
          # superuser로 본다. 테스트 계정 dbr_it 자신은 접두 dbr_it_에 맞지 않는다(LIKE의 \_는 밑줄 그대로).
          LEFTOVER="$(psql -X -At -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'database ' || datname FROM pg_database WHERE datname LIKE 'dbr\_it\_%'
          UNION ALL
          SELECT 'role ' || rolname FROM pg_roles WHERE rolname LIKE 'dbr\_it\_%'
          ORDER BY 1;
          SQL
          )"
          COUNT=0
          [ -z "$LEFTOVER" ] || COUNT="$(printf '%s\n' "$LEFTOVER" | wc -l)"
          echo "남은 테스트 DB·역할: $COUNT개"
          if [ "$COUNT" -ne 0 ]; then
            printf '%s\n' "$LEFTOVER"
            exit 1
          fi
      - name: 진단 자료 정리 (비밀번호가 들어간 파일은 올리지 않는다)
        if: always()
        shell: bash
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -u
          OUT="$RUNNER_TEMP/pg-trx"
          mkdir -p "$OUT"
          docker logs --tail 300 "$PG_CONTAINER" > "$OUT/postgres-server.log" 2>&1 || true
          if [ -f "$RUNNER_TEMP/pg-secrets.env" ]; then
            . "$RUNNER_TEMP/pg-secrets.env"
            for PW in "${SU_PW:-}" "${IT_PW:-}"; do
              [ -n "$PW" ] || continue
              # grep은 일치가 없으면 1을 내므로 || true.
              { grep -rlF -- "$PW" "$OUT" 2>/dev/null || true; } | while read -r f; do
                echo "비밀번호가 포함된 파일은 올리지 않고 삭제: $f"
                rm -f -- "$f"
              done
            done
            rm -f "$RUNNER_TEMP/pg-secrets.env"
          fi
      - name: TRX·서버 로그 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-${{ matrix.pg }}-trx
          path: ${{ runner.temp }}/pg-trx
          if-no-files-found: ignore
          retention-days: 14
