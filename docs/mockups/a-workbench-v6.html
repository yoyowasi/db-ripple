<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e6ebee">
<title>db-ripple 워크벤치 · 시안 A v6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* v6: v5에서 전파 그래프만 다듬음(왼쪽→오른쪽 배치, 결과를 말하는 노드, 원인을 말하는 간선 라벨, 경로 강조). v5: v4 시각 체계 유지(색 토큰·반경 4px·버튼 한 쌍·글자 12/13/14px + 헤드라인 20px). 검토 3건 반영: 상태 선택 목록, 그래프를 데이터 계약에 맞춤(차선 라벨·간선 번호 삭제), 결론 위계, 접근성. */
:root{color-scheme:light;--ui:"IBM Plex Sans KR","Malgun Gothic","Segoe UI",sans-serif;--mono:"JetBrains Mono","Cascadia Mono",Consolas,"D2Coding",monospace;--fs:13px;
--r:4px;--gx:14px;--m-in:150ms;--m-out:120ms;--m-press:90ms;--ease:cubic-bezier(.2,.6,.2,1);
--bg:#e6ebee;--panel:#fbfcfc;--sunk:#eef2f4;--fg:#14212a;--muted:#4f5f6b;--line:#c7d1d7;--ctl:#6f828e;--accent:#00697a;--accent-fg:#fff;
--ok:#0f6e3a;--ok-bg:#dff3e7;--warn:#85500a;--warn-bg:#fff1cf;--err:#b3261e;--err-bg:#fde8e6;
--del-bg:#fbdbd8;--del-fg:#8c1b14;--add-bg:#d6f0de;--add-fg:#12603a;--chg-bg:#ffe8a0;
--bg-fk:#dde8fb;--bg-trg:#fde9cc;
--nd:#fff;--nd-s:#6f828e;--nd-stmt:#e3f1f4;--nd-stmt-s:#00697a;--nd-trig:#fff2d8;--nd-proc:#dff3e7;--nd-proc-s:#0f6e3a;--nd-t:#14212a;--nd-t2:#4f5f6b;--halo:#fbfcfc;
--st-bg:#14212a;--st-s:#14212a;--st-fg:#f2f7f9;--st-fg2:#c5d5dd;--st-verb:#7fd8e2;
--k-fk:#1456c8;--k-fires:#a15000;--k-direct:#445560;--k-call:#0f6e3a;--k-blocked:#b3261e;
--tick:#8d9fab;--code-kw:#0a55b5;--code-num:#a63f00;--code-cm:#5f707c;--sel:rgba(0,105,122,.22)}
:root[data-theme=dark]{color-scheme:dark;--bg:#091116;--panel:#0f1a21;--sunk:#15232b;--fg:#dce8ee;--muted:#8da2af;--line:#25363f;--ctl:#6a8394;--accent:#3cc8d6;--accent-fg:#031f24;
--ok:#5fd391;--ok-bg:#123626;--warn:#f2b95a;--warn-bg:#3a2d10;--err:#ff8b90;--err-bg:#431a1f;
--del-bg:#4a1d24;--del-fg:#ff9fa4;--add-bg:#12402b;--add-fg:#86e6ad;--chg-bg:#4b4010;
--bg-fk:#18305a;--bg-trg:#3b2b10;
--nd:#142531;--nd-s:#6a8394;--nd-stmt:#0e3a41;--nd-stmt-s:#3cc8d6;--nd-trig:#3a2c12;--nd-proc:#0f3a2b;--nd-proc-s:#5fd391;--nd-t:#e8f1f5;--nd-t2:#9bb0bc;--halo:#0f1a21;
--st-bg:#0e3a41;--st-s:#3cc8d6;--st-fg:#f2f7f9;--st-fg2:#c5d5dd;--st-verb:#7fd8e2;
--k-fk:#6aa8ff;--k-fires:#ffb454;--k-direct:#9fb1bc;--k-call:#3cc8d6;--k-blocked:#ff8b90;
--tick:#46606f;--code-kw:#7db4ff;--code-num:#ffb27a;--code-cm:#7f93a2;--sel:rgba(60,200,214,.28)}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--tick) transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:var(--fs,13px)/1.5 var(--ui);color:var(--fg);background:var(--bg);min-height:100vh;font-feature-settings:"tnum";caret-color:var(--accent)}
body.dragging{user-select:none}
code,pre,input,select,.id,.mono,.code{font-family:var(--mono);font-variant-ligatures:none}code{font-size:12px}
button,input,select{font-size:inherit;caret-color:var(--accent);accent-color:var(--accent)}button{cursor:pointer;font-family:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tablist button:focus-visible,.seg button:focus-visible,.tree .it:focus-visible,.tree summary:focus-visible,.rowbtn:focus-visible{outline-offset:-2px}
::selection{background:var(--sel);color:inherit}
h1,h2,h3,h4,p{margin:0}h1,h2,h3{text-wrap:balance}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.hint{color:var(--muted);font-size:12px;margin-top:6px}
.mock-note{color:var(--muted);font-size:12px}
.skip{position:absolute;left:8px;top:-60px;z-index:9;background:var(--accent);color:var(--accent-fg);padding:6px 12px;border-radius:var(--r);text-decoration:underline;text-underline-offset:3px}
.skip:focus{top:6px}.skip:focus-visible{outline:2px solid #fff;outline-offset:2px}
.lnk{color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:13px}

/* 상자 하나: 1px 선 + 반경 4px */
.sqlbox,.confirm,.sbx code,.params input,.banner,.field{border:1px solid var(--line);border-radius:var(--r);background:var(--sunk)}
.sqlbox{margin:0 0 8px;padding:8px 10px;white-space:pre-wrap;font-size:12px}
.sbx code{padding:1px 5px;font-size:12px}
.field{background:var(--panel);border-color:var(--ctl);color:var(--fg);padding:3px 8px;font-size:13px}
.field:hover{border-color:var(--muted)}.field:focus-visible{border-color:var(--accent)}
.confirm{margin-top:10px;padding:10px;border-color:var(--err);background:var(--err-bg)}.confirm p{margin-bottom:8px}.confirm h4{font:600 14px var(--ui);margin-bottom:4px}.confirm:focus{outline:none}
.banner{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;margin:0}
.banner.err{background:var(--err-bg);border-color:var(--err);color:var(--fg)}.banner.err .ic{color:var(--err)}
.banner.warn{background:var(--warn-bg);border-color:var(--warn)}.banner.warn .ic{color:var(--warn)}
.banner .ic{margin-top:3px}.banner b{display:block}

/* 배지 */
.badge{display:inline-block;padding:0 6px;border-radius:var(--r);font-size:12px;line-height:1.6;font-weight:600;white-space:nowrap;border:1px solid transparent}
.b-certain{color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok)}
.b-inferred{color:var(--warn);background:var(--warn-bg);border:1px dashed var(--warn)}
.b-ambig{color:var(--err);background:var(--err-bg);border:1px dotted var(--err)}
.b-fk{color:var(--k-fk);background:var(--bg-fk)}.b-trg{color:var(--k-fires);background:var(--bg-trg)}
.b-dir{color:var(--muted);background:var(--sunk)}
.b-exp{color:var(--fg);background:transparent;border:1px solid var(--muted)}.b-der{color:var(--muted);background:var(--sunk);font-style:italic}
.b-assume{color:var(--warn);background:var(--warn-bg);border:1px dashed var(--warn)}
.b-ex{color:var(--muted);background:transparent;border:1px solid var(--line)}

/* 표 */
table{border-collapse:collapse}
.grid{width:100%;margin:0 0 10px;font:13px var(--mono);font-variant-numeric:tabular-nums}
.grid caption{text-align:left;font:700 13px var(--ui);padding:6px 0 4px}
.grid th{background:var(--sunk);text-align:left;font-weight:600;padding:4px 8px;border:1px solid var(--line);white-space:nowrap}
.grid td{padding:4px 8px;border:1px solid var(--line);vertical-align:top}
.grid .op,.grid .badge{font-family:var(--ui)}.grid .op{font-weight:700;width:1%;white-space:nowrap}.grid td code{font-size:12px}
.grid th .badge{margin-left:4px}
del{background:var(--del-bg);color:var(--del-fg);text-decoration:line-through;text-decoration-thickness:1px}
ins{background:var(--add-bg);color:var(--add-fg);text-decoration:none}
td.chg{background:var(--chg-bg)}
tr.rdel .op{color:var(--del-fg)}tr.radd .op{color:var(--add-fg)}
.grid tr.zero td{color:var(--muted)}
.tw{overflow-x:auto;margin:0 0 10px}.tw .grid{margin:0;width:auto;min-width:100%}

/* 버튼 한 쌍: 주(채움) · 보조(윤곽) */
.btn{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border:1px solid var(--ctl);background:var(--panel);color:var(--fg);border-radius:var(--r);font:500 13px/1.4 var(--ui);white-space:nowrap}
.btn .kb{font:12px var(--mono);opacity:.8}
.btn.sm{padding:2px 8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn:not([aria-disabled=true]):hover,.btn:not([aria-disabled=true]):focus-visible{background:color-mix(in srgb,var(--accent) 10%,var(--panel));border-color:var(--accent)}
.btn.primary:not([aria-disabled=true]):hover,.btn.primary:not([aria-disabled=true]):focus-visible{background:color-mix(in srgb,var(--accent) 84%,var(--fg))}
.btn:not([aria-disabled=true]):active{background:color-mix(in srgb,var(--accent) 20%,var(--panel))}
.btn.primary:not([aria-disabled=true]):active{background:color-mix(in srgb,var(--accent) 70%,var(--fg))}
.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* 메뉴 줄 */
.menu{display:flex;gap:18px;align-items:center;height:28px;padding:0 var(--gx);background:#14212a;color:#d4e0e7;font-size:12px}
.menu :focus-visible{outline-color:#7fd8e2}
.menu .logo{color:#fff;font:700 13px var(--mono);margin-right:6px}
.menu button{position:relative;border:0;background:none;color:inherit;font:inherit;padding:4px 0}
.menu button:hover{color:#fff;text-decoration:underline;text-underline-offset:3px}
.menu .mock{margin-left:auto;display:flex;align-items:center;gap:8px}
.menu .mock label{color:#d4e0e7}
.menu select{font:12px var(--mono);height:22px;color:#e6f0f5;background:#1f3340;border:1px solid #8aa3b3;border-radius:var(--r);padding:0 6px;max-width:300px}
.menu .mtag{color:#9db2bf;border:1px dashed #8aa3b3;border-radius:var(--r);padding:0 6px}
.bar{display:flex;align-items:center;gap:12px;min-height:36px;padding:3px var(--gx);background:var(--panel);border-bottom:1px solid var(--line);min-width:0;flex-wrap:wrap}
.sbx{display:flex;gap:4px 16px;align-items:center;flex:1;min-width:0;flex-wrap:wrap}
.sbx .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:-10px}
.sbx .dot.busy{background:var(--warn)}
.bar .btn{flex:none}
.fp{border-bottom:1px dotted var(--muted);cursor:help}

/* 분할 막대와 레이아웃 */
.work{display:flex;min-height:640px;height:calc(100vh - 66px)}
.pane{background:var(--panel);min-height:0;overflow:auto}
.pane,.bpane,.edbody,.treewrap,.gscroll,.rail-body{overscroll-behavior:contain}
.sep{flex:none;background:var(--line);position:relative}
.sep.v{width:1px;cursor:col-resize}.sep.h{height:1px;cursor:row-resize}
.sep::after{content:"";position:absolute}
.sep.v::after{left:-4px;right:-4px;top:0;bottom:0}.sep.h::after{top:-4px;bottom:-4px;left:0;right:0}
.sep:hover,.sep:focus-visible,body.dragging .sep.on{background:var(--accent)}
.sep:focus-visible{outline-offset:0;z-index:2}

/* 탐색기 */
.explorer{flex:none;width:256px;display:flex;flex-direction:column;overflow:hidden;background:var(--panel)}
.work.xoff .explorer,.work.xoff #sepx{display:none}
.exh{display:flex;align-items:center;gap:8px;padding:0 var(--gx);height:34px;flex:none;background:var(--sunk);border-bottom:1px solid var(--line);white-space:nowrap}
.exh .id{font-size:13px;font-weight:500}.exh small{color:var(--muted);font-size:12px}
.treewrap{flex:1;min-height:0;overflow:auto}
.tree{list-style:none;margin:0;padding:4px 0 6px}.tree ul{list-style:none;margin:0;padding-left:14px}
.tree summary,.tree .it{display:flex;align-items:center;gap:6px;padding:3px var(--gx);min-width:0}
.tree summary{list-style:none;color:var(--muted);font-weight:500}.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"";width:5px;height:5px;margin:0 3px 0 1px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(-45deg);flex:none}
.tree details[open]>summary::before{transform:rotate(45deg) translate(-1px,-1px)}
.tree .it::before{content:"";width:9px;flex:none}
.tree .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:13px var(--mono)}
.tree button.it{width:100%;border:0;background:transparent;color:inherit;font:inherit;text-align:left}
.tree .it:hover,.tree summary:hover{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.tree summary:hover{color:var(--fg)}
.tree .it[aria-current=true]{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.tree .it[aria-current=true] .nm{font-weight:700}
.tree .ic{color:var(--muted)}.tree .it[aria-current=true] .ic{color:var(--accent)}
.pb{flex:none;font:600 12px var(--ui);padding:0 5px;border-radius:var(--r);line-height:1.5}
.pb-d{background:var(--del-bg);color:var(--del-fg)}.pb-u{background:var(--chg-bg);color:var(--fg)}.pb-i{background:var(--add-bg);color:var(--add-fg)}
.pb-x{background:var(--err-bg);color:var(--err);border:1px solid var(--err)}.pb-k{background:var(--warn-bg);color:var(--warn);border:1px dashed var(--warn)}
.tree-foot{padding:6px var(--gx) 10px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}

/* 탭: 탭 목록에는 탭 버튼만 둔다. 도구는 형제 요소 */
.center{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel)}
.tabrow{display:flex;flex-wrap:wrap;background:var(--sunk);border-bottom:1px solid var(--line);align-items:stretch;flex:none;min-height:34px}
.tablist{display:flex;align-items:stretch;flex-wrap:wrap}
.tablist button,.seg button{position:relative;border:0;background:transparent;color:var(--muted);font:500 13px var(--ui);display:inline-flex;gap:6px;align-items:center}
.tablist button{padding:0 var(--gx);border-right:1px solid var(--line);min-height:34px}
.tablist button::after,.seg button::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:color-mix(in srgb,var(--accent) 50%,transparent);transform:scaleX(0);transform-origin:right}
.tablist button:hover,.seg button:hover{color:var(--fg)}
.tablist button:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.tablist button:hover::after,.seg button:hover::after{transform:scaleX(1);transform-origin:left}
.tablist button[aria-selected=true],.seg button[aria-selected=true]{color:var(--fg);font-weight:600}.tablist button[aria-selected=true]{background:var(--panel)}
.tablist button[aria-selected=true]::after,.seg button[aria-selected=true]::after{transform:scaleX(1);background:var(--accent)}
.tabrow .tool{margin-left:auto;display:flex;gap:8px;padding:2px var(--gx);align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:16px;border-bottom:1px solid var(--line);margin:0 0 10px}.seg button{padding:6px 0}

/* 편집기 */
.ed{flex:none;height:132px;min-height:68px;overflow:hidden;display:flex;flex-direction:column}
.ed.col{height:35px!important;min-height:35px}
.edbody{flex:1;min-height:0;overflow:auto}
.code{display:grid;grid-template-columns:44px 1fr;font:13px/22px var(--mono);padding-top:4px}
.code .g{color:var(--code-cm);background:var(--sunk);border-right:1px solid var(--line);user-select:none}
.code .gl{display:flex;justify-content:flex-end;align-items:center;gap:5px;padding-right:10px;height:22px}
.code .gl .ic{width:12px;height:12px}.gl.w .ic{color:var(--warn)}.gl.e .ic{color:var(--err)}
.code .l{padding-left:var(--gx);white-space:pre;overflow:hidden}
.code .l div{height:22px}
.kw{color:var(--code-kw);font-weight:700}.num{color:var(--code-num)}.cm{color:var(--code-cm)}
.sq.rj{text-decoration:underline wavy var(--err);text-underline-offset:4px}
.diag{margin:6px 0 0;padding:0;border-top:1px solid var(--line);font-size:13px}
.diag li{list-style:none;display:grid;grid-template-columns:72px 96px 1fr;gap:8px;padding:3px var(--gx);align-items:center;border-bottom:1px solid var(--sunk)}
.diag .t{display:flex;gap:5px;align-items:center;font-weight:600}.diag .w .t{color:var(--warn)}.diag .e .t{color:var(--err)}.diag .i .t{color:var(--ok)}.diag .ln{font:12px var(--mono);color:var(--muted)}
.procwrap{padding:10px var(--gx);max-width:760px}
.proc .assume{margin-bottom:8px}
.params{width:100%;margin-bottom:8px}.params th{text-align:left;font-weight:600;color:var(--muted);padding:3px 6px;border-bottom:1px solid var(--line)}
.params th:first-child,.params td:first-child{padding-left:0}
.params td{padding:3px 6px;border-bottom:1px solid var(--line);white-space:nowrap}.params td:nth-child(3){width:48%}
.params input{width:100%;padding:3px 6px;background:var(--panel);color:var(--fg);border-color:var(--ctl)}
.params input:hover{border-color:var(--muted)}.params input:focus-visible{border-color:var(--accent)}
.params .req{color:var(--muted);font-size:12px}

/* 결과 */
.bottom{flex:1;min-height:0;display:flex;flex-direction:column}
.bpane{flex:1;min-height:0;overflow:auto}
.bpane.gp{display:flex;flex-direction:column;overflow:hidden}
.pad{padding:10px var(--gx)}
.res-empty{padding:28px var(--gx);color:var(--muted);max-width:60ch}
.res-empty h3{font:600 14px var(--ui);color:var(--fg);margin-bottom:4px}
.gtool{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:6px var(--gx);border-bottom:1px solid var(--line);flex:none}
.gtool .grp{display:flex;gap:4px;align-items:center}
.gtool label{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.gtool input[type=search]{width:170px}
.lgd{padding:6px var(--gx);font-size:12px;color:var(--muted);flex:none;border-bottom:1px solid var(--line)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.legend li{display:flex;align-items:center;gap:5px;white-space:nowrap}.legend .ord{color:var(--fg);font-weight:600}
.lg{width:30px;height:10px}.lg path{fill:none;stroke-width:2.2}
.lg .nsw{fill:var(--nd);stroke:var(--nd-s);stroke-width:1.4}
.gwrap{flex:1;min-height:0;display:flex}
.gscroll{flex:1;min-width:0;overflow:hidden;position:relative;cursor:grab;touch-action:none;background:var(--panel)}
.gscroll.grabbing{cursor:grabbing}.gscroll:focus-visible{outline-offset:-2px}
.gnote{position:absolute;left:10px;bottom:10px;padding:3px 10px;border:1px solid var(--ctl);border-radius:var(--r);background:var(--panel);color:var(--fg);font-size:12px;pointer-events:none}
.graph{display:block;position:absolute;left:0;top:0}
.graph .ls{display:none}.graph.lo .lf{display:none}.graph.lo .ls{display:inline}
.graph.lo .sch,.graph.lo .xtra,.graph.lo .num,.graph.lo .l2,.graph.lo .sub,.graph.lo .tgs{display:none}
.graph.lo .t-tbl .res{font-size:17px}.graph.lo .t-tbl .nm{font-size:14px}.graph.lo .t-stmt .l1,.graph.lo .t-call .l1{font-size:14px}.graph.lo .t-trig .tgn{font-size:13px}.graph.lo .lb text{font-size:14px}.graph.lo .t-err .res{font-size:17px}
.zoomv{min-width:3.2em;text-align:right;font:600 12px var(--mono);color:var(--fg)}
.graph .node{cursor:pointer}
.graph .node text{stroke:none}
.graph .ni{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.graph .bx{fill:var(--nd);stroke:var(--nd-s);stroke-width:1.4}
.graph .gly{fill:none;stroke:var(--nd);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* 문장: 진한 알약 */
.graph .t-stmt .bx{fill:var(--st-bg);stroke:var(--st-s)}
.graph .t-stmt .l1{font:700 13px var(--mono);fill:var(--st-fg)}.graph .t-stmt .l1 .vb{fill:var(--st-verb)}
.graph .t-stmt .l2{font:12px var(--ui);fill:var(--st-fg2)}
