<style>

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font:14px/1.5 var(--font);padding-bottom:56px;min-width:320px}
button{font:inherit;color:inherit;cursor:pointer}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
code,kbd,.mono{font-family:var(--mono)}
kbd{font-size:11px;border:1px solid var(--line2);border-radius:3px;padding:0 4px;margin-left:6px;color:inherit;opacity:.9}

.brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}

.k{color:var(--ink2);font-weight:600}

.sg.mod{background:var(--mod-bg);color:var(--mod)}

.car{display:inline-block;width:2ch;color:var(--ink2)}

.nt{font:12.5px var(--font);color:var(--ink2);padding-right:10px;white-space:nowrap;display:flex;align-items:center}

.diff{padding:2px 12px 10px calc(32px + var(--ind)*1ch + 10px)}

.dl.inf{border-left-style:dashed}
.dm{font:12px var(--font);color:var(--ink3);padding:2px 0 4px 12px}

.empty h2{margin:0 0 6px;color:var(--ink);font-size:22px}

.bot .sw button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.bot kbd{font-size:10.5px;margin:0 3px 0 8px}

</style>

}
function findNode(id){var T=TREE[S.state];if(!T)return null;return allNodes(T,[]).filter(function(n){return n.id===id})[0]}
function toggleZero(){var T=TREE[S.state];if(!T)return;S.zero=!S.zero;var fid=S.focus;render(fid);live(S.zero?"0행 쓰기 "+zeroTotal(T)+"건을 보입니다":"0행 쓰기를 숨깁니다")}
function toggleAll(){if(!TREE[S.state])return;S.all=!S.all;if(!S.all)S.open={};render(S.focus);live(S.all?"모두 펼침":"모두 접음")}
function openConfirm(){
  if(!(S.state==="dm1"||S.state==="dm2"))return;
  S.confirm=true;render();var i=$("#cf-in");if(i)i.focus();live("적용 확인 단계. apply를 입력하세요")
}
function runPreview(){
  if(S.state==="rej"){live("거부됨. 2행의 DROP TABLE은 미리보기할 수 없습니다");return}
  if(S.state==="applied"){live("기준선을 만드는 동안 미리보기할 수 없습니다");return}
  live("미리보기 실행 중");var s=S.state==="empty"?"dm2":S.state;
  setTimeout(function(){go(s)},350);
}
document.addEventListener("click",function(e){
  var t=e.target;
  var act=t.closest&&t.closest("[data-act]");
  if(act){
    var a=act.dataset.act;e.stopPropagation();
    if(a==="zero")toggleZero();else if(a==="all")toggleAll();else if(a==="conds"){S.conds=!S.conds;render();var b=$('[data-act="conds"]');if(b)b.focus()}
    return;
  }
  var sw=t.closest&&t.closest(".bot .sw button");if(sw){go(sw.dataset.s);return}
  var it=t.closest&&t.closest(".item[data-x]");if(it&&!t.closest(".diff")){toggleItem(it.dataset.id);return}
  var id=t.id||(t.closest("button")||{}).id;
  if(id==="theme"){S.theme=S.theme==="dark"?"light":"dark";render(S.focus);live(S.theme==="dark"?"어두운 테마":"밝은 테마")}
  else if(id==="run"||id==="run2")runPreview();
  else if(id==="apply")openConfirm();
  else if(id==="cancel")go("empty");
  else if(id==="cf-no"){S.confirm=false;render();var b=$("#apply");if(b)b.focus()}
  else if(id==="cf-ok"){var i=$("#cf-in");if(i&&i.value==="apply")go("applied")}
  else if(id==="goto2"){var l=$("#ln2");if(l)l.focus()}
  else if(id==="newprev"){stopReb();go("dm2","새 미리보기를 실행했습니다")}
  else if(id==="refresh"){live("샌드박스 새로 고침 중");go("drift","샌드박스를 새로 고쳤습니다. 다시 미리보기하세요")}
});
document.addEventListener("input",function(e){
  if(e.target.id==="cf-in"){var ok=e.target.value==="apply";$("#cf-ok").disabled=!ok;$("#cf-h").textContent=ok?"켜졌습니다. 원본에 적용을 누르세요":"apply를 입력하면 켜집니다"}
});
document.addEventListener("keydown",function(e){
  var t=e.target,typing=t.tagName==="INPUT"||t.tagName==="TEXTAREA";
  if(e.key==="Escape"){if(S.confirm){e.preventDefault();S.confirm=false;render();var b=$("#apply");if(b)b.focus()}return}
  if(e.ctrlKey&&e.key==="Enter"){e.preventDefault();if(e.shiftKey)openConfirm();else runPreview();return}
  if(typing&&e.key==="Enter"&&t.id==="cf-in"){e.preventDefault();if(t.value==="apply")go("applied");return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  var onBtn=t.closest&&t.closest("button,summary,a");
  if(e.key==="j"||(e.key==="ArrowDown"&&t.closest&&t.closest(".tree"))){e.preventDefault();moveFocus(1)}
  else if(e.key==="k"||(e.key==="ArrowUp"&&t.closest&&t.closest(".tree"))){e.preventDefault();moveFocus(-1)}
  else if(e.key==="z"){toggleZero()}
  else if(e.key==="e"){toggleAll()}
  else if((e.key==="Enter"||e.key===" ")&&!onBtn){var it=t.closest&&t.closest(".item[data-x]");if(it){e.preventDefault();toggleItem(it.dataset.id)}}
});
window.addEventListener("hashchange",function(){var h=parseHash();if(h.theme==="dark"||h.theme==="light")S.theme=h.theme;if(STATES.indexOf(h.state)>=0&&h.state!==S.state)go(h.state);else render()});

/* 시작 */
(function(){var h=parseHash();if(h.theme==="dark"||h.theme==="light")S.theme=h.theme;var st=STATES.indexOf(h.state)>=0?h.state:"dm2";S.state=st;initOpen();if(st==="applied")startReb();render()})();
})();
</script>
</body>
</html>
